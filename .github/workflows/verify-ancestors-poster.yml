name: Verify public film poster sources
on:
  push:
    branches: [gpt/verify-ancestors-poster]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: |
          python - <<'PY'
          import base64, io, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from PIL import Image
          candidates = [["tmdb","https://image.tmdb.org/t/p/original/1LCbsi1Djz1yp1aJPM4Zr6PklLC.jpg"],["cineamo","https://cineamo-tmdb.b-cdn.net/t/p/w780/1LCbsi1Djz1yp1aJPM4Zr6PklLC.jpg?width=640"],["flixster","https://resizing.flixster.com/s6dFIignY1HgiHyjZ3xleRJAzno%3D/ems.cHJkLWVtcy1hc3NldHMvbW92aWVzL2U4YjBjNTAxLTU1ZDktNDVmNS04MDMyLTA5ZjlhZTJhNmRkOC5qcGc%3D"],["adoro","https://br.web.img3.acsta.net/img/22/ff/22ff8687dbdaf912e930c93933ace1f0.jpg"]]
          def inspect(candidate):
              name, url = candidate
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      im = Image.open(io.BytesIO(response.read()))
                  small = im.convert("L").resize((72, 96))
                  return f"POSTER-PREVIEW {name} {im.width} {im.height} " + base64.b64encode(small.tobytes()).decode()
              except Exception as exc:
                  return f"POSTER-ERROR {name} {exc}"
          with ThreadPoolExecutor() as pool:
              for result in pool.map(inspect, candidates):
                  print(result)
          PY
