name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 场次变更记录要读 git 历史（tools/build-changes.js）
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate film guidance and personal archive compatibility
        run: |
          node tools/check-content.js
          node tools/check-library.js
          node tools/check-companion.js
          node tools/check-taste.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Save external posters as site files (canvas and mini program need same-site images)
        run: |
          python -m pip install --quiet pillow
          python tools/localize-posters.py
      - name: Build share pages and calendar feeds
        run: node tools/build-extras.js
      - name: Build poster thumbnails (WebP 360/720, JPEG 360)
        run: python tools/build-thumbs.py
      - name: Build screening change log (moves by stable screening id)
        run: node tools/build-changes.js
      - name: Build lite startup data and data version
        run: node tools/build-lite.js
      - name: Version app.css and app.js by content hash
        run: node tools/build-assets.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
