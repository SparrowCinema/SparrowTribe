/* Ticket purchase: original mini-program codes, uncropped */
.ticket-card{display:flex;align-items:center;gap:16px;margin-top:20px;padding:18px 14px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;position:relative;box-shadow:0 4px 18px #2b211708}
.ticket-copy{min-width:0;flex:1}.ticket-copy>small{display:block;font:9px var(--f-mono);letter-spacing:.15em;color:var(--accent)}
.ticket-copy h2{font:900 21px/1.3 var(--f-display);margin:7px 0 8px}.ticket-copy p{font-size:11px;line-height:1.7;color:var(--muted);margin:0 0 10px}
.ticket-expand{font-size:11px;color:var(--accent);border-bottom:1px solid currentColor;padding-bottom:3px}
.ticket-code{flex:none;width:128px;padding:6px;background:#fff;border-radius:8px;box-shadow:0 0 0 1px #00000008}
.ticket-code img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain}.ticket-code:focus-visible,.ticket-expand:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.ticket-modal{box-sizing:border-box;width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);box-shadow:0 20px 80px #0005}
.ticket-modal::backdrop{background:#17100bbd;backdrop-filter:blur(5px)}
.ticket-modal header{display:flex;align-items:center;justify-content:space-between;gap:12px}.ticket-modal h2{font:800 20px/1.4 var(--f-display);margin:0}.ticket-modal .ticket-close{flex:none;border-radius:50%;width:34px;height:34px;background:var(--chip);font-size:22px}
.ticket-modal img{display:block;width:100%;max-width:430px;margin:18px auto 12px;background:#fff;border-radius:10px;height:auto}
.ticket-modal p{font-size:12px;color:var(--muted);line-height:1.8;margin:8px 0}.ticket-save{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;margin-top:14px}
@media(max-width:360px){.ticket-card{gap:10px}.ticket-code{width:114px}.ticket-copy h2{font-size:19px}}
@media print{.ticket-card,.ticket-modal{display:none!important}}


/* ---- 每部影片一种柔和浅色 + 语言字幕（claude/gantt-film-colors-lang） ---- */
.fc{--c:hsl(var(--h) var(--barS) var(--barL));--i:hsl(var(--h) 38% var(--inkL));background:var(--c)!important;color:var(--i)!important;border:1px solid hsl(var(--h) var(--barS) var(--lineL))}

.tt-l{font-size:10.5px;line-height:1.35;opacity:.9}

.blk .l{font-size:10.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tt-add.fa{--c:hsl(var(--h) var(--barS) var(--barL));--i:hsl(var(--h) 38% var(--inkL));color:var(--i);background:var(--c);border-color:var(--i)}
.tt-add.fa:hover{background:color-mix(in srgb,var(--c) 80%,var(--i))}
.tt-add.fa.on{background:var(--i);color:var(--c);border-color:var(--i)}
.fd-tdate.fc{border:0;border-right:1px solid hsl(var(--h) var(--barS) var(--lineL))}
.ag-row .bar.fc{border:0;background:hsl(var(--h) 40% 62%)!important}

/* ---- 伴手礼周边（claude/film-gifts） ---- */
.fd-gift{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.fd-gift+.fd-gift{margin-top:8px}
.fd-gl{display:inline-block;font:600 11px var(--f-body);letter-spacing:.04em;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:1px 6px;margin-bottom:8px}
.fd-gift ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.fd-gift li{font-size:13px;line-height:1.4;padding:5px 9px;border-radius:7px;background:var(--chip)}
.fd-gnote{font-size:11px;color:var(--muted);margin:8px 0 0}

/* ---- 专题底栏页（claude/programmes-tab） ---- */
.pgl-h{margin-top:18px}
.view>.pgl-h:first-of-type{margin-top:6px}
/* Post-screening discussion: compact dashed event card below the film screening time. */
.fd-qa{margin:12px 0 4px;padding:12px 14px;border:1.5px dashed var(--teal);border-radius:12px;background:color-mix(in srgb,var(--teal) 7%,var(--surface));display:grid;gap:6px}
.fd-qa-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.fd-qa-label{font:700 11px var(--f-body);letter-spacing:.06em;color:var(--teal)}
.fd-qa-time{font:700 13px var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums}
.fd-qa-guest{font:11px/1.6 var(--f-body);color:var(--muted)}
@media(max-width:400px){.fd-qa{padding:10px 11px}.fd-qa-time{font-size:12px}}
/* Separate Q&A panel on every film detail page. */
.fd-qa-panel{border:1px solid var(--line);border-radius:13px;background:linear-gradient(125deg,color-mix(in srgb,var(--teal) 9%,var(--surface)),var(--surface));padding:16px;box-shadow:0 3px 14px #2b211708}
.fd-qa-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.fd-qa-panel-body{margin-top:10px;font-size:12px;line-height:1.7;color:var(--fg)}.fd-qa-empty{background:var(--surface)}.fd-qa-empty .fd-qa-panel-body{color:var(--muted)}
.g-qa{position:absolute;top:4px;bottom:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px dashed var(--teal);border-radius:5px;background:color-mix(in srgb,var(--teal) 12%,var(--surface));color:var(--teal);font:700 10px var(--f-body);cursor:pointer;padding:1px;z-index:1}.g-qa:hover,.tt-qa:hover{background:color-mix(in srgb,var(--teal) 20%,var(--surface))}
.tt-qa{position:absolute;left:4px;right:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--teal);border-radius:8px;background:color-mix(in srgb,var(--teal) 10%,var(--surface));color:var(--teal);cursor:pointer;font:700 12px var(--f-body)}.tt-qa small{font:10px var(--f-mono)}

/* Compact programme navigation and a searchable, city-aware cinema directory. */
.section-tabs{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 16px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.section-tabs button{font-size:12px;line-height:1.4;padding:8px 12px;border-radius:20px;font-weight:600;min-height:34px}
.fi-stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:2px 0 10px}.fi-stats span{font-size:12px;color:var(--muted)}.fi-stats b{font:600 22px/1.2 var(--f-mono);color:var(--fg);margin-right:5px}.fi-sub{margin-top:0}
.fsec{border-top:1px solid var(--line);margin-top:24px}.fsec .fgrp{border-top:0;margin-top:0}
.fsec .fgrp2{align-items:center;flex-direction:row}.fgrp-main{min-width:0;flex:1}.fgrp-meta{display:block;margin-top:6px;font-size:10px;line-height:1.6;letter-spacing:.08em;color:var(--muted)}.fgrp-side{display:flex;align-items:center;gap:10px;flex-shrink:0}

.fold-btn svg{width:16px;height:16px;transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.fold-btn:hover{border-color:var(--accent);color:var(--accent)}.fold-btn:active{transform:scale(.9)}
.fsec.closed .fold-btn,details:not([open])>summary .fold-btn{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fsec.closed .fold-btn svg,details:not([open])>summary .fold-btn svg{transform:rotate(-90deg)}
.fsec.closed .fsec-body{display:none}.fsec-body{animation:fsecIn .22s ease-out}@keyframes fsecIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fstack{display:none;align-items:center}.fsec.closed .fstack,.fold-prog .fstack{display:inline-flex}
.fstack img,.fstack i{width:22px;height:30px;border-radius:4px;object-fit:cover;border:2px solid var(--bg);margin-left:-9px;box-shadow:0 1px 3px rgba(40,25,10,.18);display:grid;place-items:center;font:700 10px var(--f-display);font-style:normal;color:#fff}.fstack>:first-child{margin-left:0}

.fgone>summary b{font:600 12px var(--f-mono);color:var(--fg)}.fgone>summary svg{width:14px;height:14px;transition:transform .2s}.fgone:not([open])>summary svg{transform:rotate(-90deg)}.fgone[open]>summary{border-style:solid;color:var(--fg)}
.fgone .flist{opacity:.82}
.fpast-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:40px;padding-top:18px;border-top:2px solid var(--fg)}.fpast-h h3{margin:0;font-size:clamp(18px,2.6vw,22px)}.fpast-h small{font-size:11px;color:var(--muted)}
.fold-prog{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:10px;overflow:hidden}.fold-prog>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px}.fold-prog>summary::-webkit-details-marker{display:none}
.fold-prog .fp-t{flex:1;min-width:0;display:flex;flex-direction:column}.fold-prog .fp-t b{font:900 16px/1.35 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fold-prog .fgrp-kind{margin-bottom:2px}
.fold-prog .fp-n{font:500 11px var(--f-mono);color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fold-prog[open]>summary{border-bottom:1px solid var(--line)}.fold-prog .flist{padding:0 14px}
@media(max-width:480px){.fsec .fgrp2{flex-direction:row;align-items:center}.fgrp-main h3{white-space:normal}.fstack img,.fstack i{width:19px;height:26px;margin-left:-8px}}
.fgrp{display:flex;align-items:end;justify-content:space-between;gap:16px;padding:18px 0 14px;border-top:1px solid var(--line);margin-top:24px}
.fgrp-kind{display:block;font-size:10px;letter-spacing:.18em;color:var(--muted);margin-bottom:6px}
.fgrp h3{font-size:clamp(20px,3vw,26px);margin:0;line-height:1.3;white-space:nowrap}
:lang(en) .fgrp h3{white-space:normal}
.fgrp>small{font-size:10px;line-height:1.6;letter-spacing:.08em;color:var(--muted);max-width:46%;text-align:right}
/* One bounded control row; long lists live in a searchable selector. */
.schedule-filterbar{display:grid;grid-template-columns:1.15fr .8fr 1.25fr;gap:0;margin:18px 0 20px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.schedule-filter{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;padding:11px 14px;background:none;border:0;color:var(--fg);text-align:left;font:inherit;cursor:pointer}
.schedule-filter+button{border-left:1px solid var(--line)}.schedule-filter:hover{background:var(--chip)}.schedule-filter>span{min-width:0}.schedule-filter small{display:block;font-size:10px;line-height:1.3;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}.schedule-filter b{display:block;font-size:13px;line-height:1.4;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.schedule-filter svg{width:12px;height:12px;flex-shrink:0;color:var(--muted)}.schedule-filter.active{box-shadow:inset 0 -2px var(--accent)}
.filter-reset-row{display:flex;justify-content:flex-end;margin:-12px 0 12px}.filter-reset{font:inherit;font-size:11px;color:var(--muted);background:none;border:0;padding:4px;cursor:pointer}
.schedule-selector{box-sizing:border-box;width:min(480px,calc(100% - 32px));max-height:min(560px,76dvh);padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);box-shadow:0 24px 80px #0002;overflow:hidden}
.schedule-selector[open]{display:flex;flex-direction:column}.selector-head,.selector-search{flex-shrink:0}.selector-results{flex:1;min-height:0}
.schedule-selector::backdrop{background:rgba(25,20,15,.23);backdrop-filter:blur(2px)}
.selector-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;gap:12px}.selector-head h2{font-size:19px;line-height:1.3;margin:0}.selector-close{border:0;background:var(--bg);border-radius:50%;width:30px;height:30px;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.selector-search{display:flex;align-items:center;gap:9px;margin:0 20px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}.selector-search svg{width:16px;height:16px;flex-shrink:0;color:var(--muted)}.selector-search input{min-width:0;width:100%;font:inherit;font-size:14px;border:0;outline:0;background:transparent;color:var(--fg)}.selector-search:focus-within{border-color:var(--teal);box-shadow:0 0 0 2px color-mix(in srgb,var(--teal) 12%,transparent)}

<style>
/* Layout: a phone app shell — sticky top bar, three tabs (排片 Gantt / 片目 / 影展), full-screen film detail pages. Palette pulled from the poster: sea teal, sand, ochre, oxblood title red. */
:root{
  --bg:#efe6d4; --surface:#f8f2e6; --line:#d8cbb1; --line-soft:#e6dcc7;
  --fg:#2b2117; --muted:#7a6a55;
  --oxblood:#8e2a22; --teal:#2f6f6c; --ochre:#b26a1f; --olive:#5d6b2e;
  --accent:#8e2a22; --on-block:#fffaf0; --chip:#e5d8bf;
  --barS:36%; --barL:85%; --lineL:68%; --inkL:22%;  /* per-film pastel blocks */
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --px:2px;  /* Gantt scale: 2px per minute */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#211b15; --line:#3b3128; --line-soft:#2c241d;
  --fg:#f1e6d3; --muted:#a8977f; --oxblood:#a8382e; --teal:#33807b; --ochre:#b8741f; --olive:#6b7a35;
  --accent:#e0705e; --on-block:#fff8ec; --chip:#2e261e; --barS:22%; --barL:26%; --lineL:40%; --inkL:90%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#211b15; --line:#3b3128; --line-soft:#2c241d;
  --fg:#f1e6d3; --muted:#a8977f; --oxblood:#a8382e; --teal:#33807b; --ochre:#b8741f; --olive:#6b7a35;
  --accent:#e0705e; --on-block:#fff8ec; --chip:#2e261e; --barS:22%; --barL:26%; --lineL:40%; --inkL:90%; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.app{overflow-anchor:none;max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px}
.topbar .row{display:flex;align-items:center;gap:12px;min-height:40px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:24px;color:var(--oxblood);letter-spacing:.02em}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.12em}
.topbar .sp{flex:1}
.pill{font-family:var(--f-mono);font-size:11px;padding:3px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted);white-space:nowrap}
.credit{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.credit small{font-size:10px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.back{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:500;padding:6px 8px 6px 0;color:var(--accent)}
.back svg{width:20px;height:20px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:11px;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

.view{padding-block:16px 24px}
h2.sec{font-family:var(--f-display);font-weight:900;font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}

/* legend + day chips */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Gantt */
.gantt{position:relative;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:10px;background:var(--surface);-webkit-overflow-scrolling:touch}
.g-inner{position:relative;display:grid;grid-template-columns:64px auto}
.g-corner,.g-day{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line)}
.g-corner{border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);display:flex;align-items:flex-end;padding:0 0 6px 8px;letter-spacing:.1em}
.g-ruler{position:relative;height:30px;border-bottom:1px solid var(--line)}
.g-ruler span{position:absolute;top:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);transform:translateX(-50%)}
.g-day{display:flex;flex-direction:column;justify-content:center;padding-left:10px;border-bottom:1px solid var(--line-soft);height:76px;min-width:0}
.g-day b{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.g-day small{font-size:11px;color:var(--muted)}
.g-track{position:relative;height:76px;border-bottom:1px solid var(--line-soft);
  background-image:repeating-linear-gradient(to right,var(--line-soft) 0 1px,transparent 1px calc(var(--px)*30)),repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px calc(var(--px)*60))}
.blk{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px;color:var(--on-block);text-align:left;overflow:hidden;border-right:1px solid var(--surface);border-left:1px solid var(--surface);transition:filter .15s}
.blk:hover{filter:brightness(1.08)}
.blk .t{font-weight:700;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blk .m{font-family:var(--f-mono);font-size:10.5px;opacity:.9;white-space:nowrap;font-variant-numeric:tabular-nums}
.blk.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{filter:brightness(1.35)}}
.gantt.compact{cursor:pointer;overflow:hidden}
.gantt.compact .g-day{padding-left:7px}
.gantt.compact .g-day b{font-size:12px}
.gantt.compact .g-ruler{height:22px}
.gantt.compact .g-ruler span{top:4px;font-size:10px}
.gantt.compact .blk{padding:4px 3px;justify-content:center}
.gantt.compact .blk .t{font-size:10.5px;font-weight:700;-webkit-line-clamp:2;line-height:1.15;word-break:break-all}
.gantt.compact:hover{border-color:var(--accent)}
.open-full{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--fg);color:var(--bg);text-align:left}
.open-full span{font-weight:700;font-size:15px}
.open-full small{flex:1;font-size:12px;opacity:.7}
.open-full svg{width:20px;height:20px;flex:none}
.full-g .gantt{max-height:none}
.hint{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}

/* agenda list under gantt */
.g-day .hl{font-size:10px;color:var(--accent);line-height:1.2;margin-top:2px}
.blockh{font-family:var(--f-display);font-weight:900;font-size:18px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.blockh small{font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.1em}
.venues{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.venue{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px}
.vhead{display:flex;align-items:center;gap:12px}
.vmark{width:40px;height:40px;flex:none;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:18px}
.vname{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.vname b{font-size:16px}.vname small{font-size:11px;color:var(--muted);letter-spacing:.14em}
.vcount{font-size:12px;color:var(--muted);text-align:right}.vcount b{font-family:var(--f-mono);font-size:20px;color:var(--fg);margin-right:2px}
.halls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hall{flex:1 1 140px;border-radius:8px;background:var(--bg);padding:9px 12px;display:flex;flex-direction:column}
.hall b{font-size:14px}.hall small{font-size:11px;color:var(--muted)}
.agenda{margin-top:26px;display:flex;flex-direction:column;gap:18px}
.ag-day h3{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 6px;font-weight:500}
.ag-row{display:grid;grid-template-columns:52px 4px 1fr auto;gap:10px;align-items:center;width:100%;padding:10px 0;border-bottom:1px solid var(--line-soft);text-align:left}
.ag-row .tm{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.ag-row .bar{align-self:stretch;border-radius:2px}
.ag-row .nm{min-width:0}
.ag-row .nm b{display:block;font-size:15px}
.ag-row .nm small{color:var(--muted);font-size:12px}
.chev{color:var(--muted);width:16px;height:16px}

.pg-slots{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.pg-slot-count{font-size:10px;color:var(--muted)}
.pg-slots .pg-slot{display:flex;flex-wrap:wrap;gap:3px 8px;margin:0;padding:5px 0;border-top:1px solid var(--line-soft)}
.pg-slots .pg-slot small{flex-basis:100%;font:10px/1.5 var(--f-body);color:var(--muted);white-space:normal}
.pg-slot-past{opacity:.65}
/* films list */
.film-language{display:block;margin-top:4px;color:var(--teal);font-size:11px;line-height:1.7;overflow-wrap:anywhere}

.flist{display:flex;flex-direction:column}
.fcard{display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line-soft);text-align:left;width:100%}
.slate{aspect-ratio:2/3;width:58px;max-width:100%;border-radius:4px;color:var(--on-block);display:flex;flex-direction:column;justify-content:space-between;padding:6px;font-family:var(--f-mono);font-size:10px}
.slate b{font-family:var(--f-display);font-size:19px;line-height:1;font-weight:900}
.fcard .info{min-width:0}
.fcard .info b{font-size:16px;display:block;line-height:1.35}
.fcard .info .o{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .info .d{font-size:12px;color:var(--muted)}
.score{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted);line-height:1.4}
.score b{font-size:17px;color:var(--fg);display:block}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.fchip{flex:none;font-size:13px;padding:5px 12px;border-radius:99px;background:var(--chip);color:var(--fg)}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* detail */
.hero{color:var(--on-block);padding-block:22px 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.05) 22px 23px);pointer-events:none}
.slate.has{padding:0;overflow:hidden}

.hero.withp{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:end}
.hero-bg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);max-width:none;object-fit:cover;filter:blur(24px) brightness(.55) saturate(1.2);z-index:0}
.hero-p{position:relative;z-index:1;width:118px;max-width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hero-txt{position:relative;z-index:1;min-width:0}

.hero h1{font-family:var(--f-display);font-weight:900;font-size:36px;line-height:1.15;margin:6px 0 4px;text-wrap:balance}

.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

.ratings{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:-1px;padding-block:14px;background:var(--surface);border-bottom:1px solid var(--line)}
.rt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:8px;background:var(--bg);min-width:0}
.rt .lbl{font-size:10px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.rt .v{font-family:var(--f-mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.rt .v.na{color:var(--muted);font-weight:400}
.rt .u{font-size:9.5px;color:var(--muted);font-family:var(--f-mono)}
.rnote{font-size:11px;color:var(--muted);padding-block:6px 0}
.shows{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.show{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}
.show .dt{font-family:var(--f-mono);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.show .x{flex:1;font-size:13px;color:var(--muted)}
.show .go{font-size:12px;color:var(--accent);font-weight:500}
.dsec{margin-top:26px}
.dsec h3{font-family:var(--f-display);font-size:18px;font-weight:900;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}

.dir-card{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.mono-av{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--on-block);font-family:var(--f-display);font-weight:900;font-size:18px}
.dir-card b{display:block}
.dir-card small{color:var(--muted);font-size:12px}
.statement{border-left:3px solid var(--line);padding-left:14px;color:var(--fg)}
.src{font-size:11px;color:var(--muted)}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:30px}
.nav2 button{border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;font-size:12px;color:var(--muted);min-width:0}

.nav2 button:last-child{text-align:right}


/* Extended film notes */

@media (min-width:900px){.credits-grid{grid-template-columns:6em minmax(0,1fr);font-size:14px}.film-facts{max-width:860px}.watch-list,.honors-list,.film-sources{max-width:65ch}}

/* Personal programme */

-family:var(--f-display)}.my-entry small{display:block;margin-top:5px;font-size:12px;color:var(--muted)}.my-entry>span:last-child{font-size:24px;color:var(--accent)}.local-note{font-size:11px;line-height:1.7;color:var(--muted);margin:18px 0}.about-fold{font-size:13px;margin:28px 0;color:var(--muted)}.about-fold summary{cursor:pointer}.page-heading{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:18px}.page-heading h2{margin-top:8px}.plan-toolbar,.export-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.plan-list{border-top:1px solid var(--line)}.plan-row{display:flex;align-items:center;gap:15px;padding:18px 0;border-bottom:1px solid var(--line);break-inside:avoid}.plan-date{width:50px;flex-shrink:0;font:600 17px var(--f-mono)}.plan-date small{display:block;font:11px var(--f-body);color:var(--muted);margin-top:4px}.plan-info{flex:1;min-width:0}.plan-info>button{padding:0;text-align:left}.plan-info b{font-size:15px}.plan-info>small{font-size:11px;color:var(--muted);display:block;margin-top:3px}.plan-time{font:12px var(--f-mono);margin-top:7px}.conflict{border:1px solid var(--accent);padding:14px;border-radius:9px;font-size:12px;margin-bottom:18px;color:var(--accent)}.conflict p{margin:6px 0 0}.empty-plan{text-align:center;padding:58px 8px}.empty-plan>span{font-size:44px;color:var(--accent)}.empty-plan h3{font-family:var(--f-display)}.empty-plan p{color:var(--muted);font-size:13px}.share-paper{background:var(--surface);border:1px solid var(--line);padding:24px 18px;border-radius:5px}.paper-brand{font:900 22px var(--f-display);color:var(--oxblood);padding-bottom:20px;border-bottom:1px solid var(--line)}.paper-brand span{font:9px var(--f-mono);letter-spacing:.08em;display:block;margin-top:5px}.share-paper h3{font:900 26px var(--f-display);margin:22px 0 6px}.paper-count{font-size:12px;color:var(--muted);margin-top:0}.share-paper footer{font-size:10px;color:var(--muted);margin-top:24px;line-height:1.8}.share-link-box{border:1px solid var(--line);padding:14px;margin:15px 0;border-radius:8px}.share-link-box label,.share-link-box small{display:block;font-size:11px;color:var(--muted)}.share-link-box input{box-sizing:border-box;width:100%;padding:10px;margin:8px 0;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:5px}#toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:9px;font-size:13px;z-index:100;max-width:85vw;transition:.2s}#toast.visible{opacity:1;transform:translate(-50%,0)}@media(min-width:900px){.my-hero,.my-entry,.plan-list,.local-note,.about-fold,.share-paper,.conflict{max-width:860px}.show-choice{flex-direction:row;align-items:center}.plan-row{gap:22px}.share-paper{padding:32px}.my-stats{gap:70px}}@media(max-width:400px){.plan-row{gap:9px}.plan-row .plan-toggle{font-size:10px;padding:6px}.plan-date{width:44px}.plan-info b{font-size:14px}}@media print{body{background:white!important;color:#222!important}.topbar,.tabbar,.export-tools,.page-heading,.local-note,.share-link-box,#toast{display:none!important}.app{border:0;max-width:100%;padding:0}.share-paper{border:0;max-width:none;background:white;color:#222}.plan-row{border-color:#ddd}.view{padding:0}.paper-brand,.plan-time{color:#222}body::before{display:none}}

/* about */
.about p{max-width:65ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:14px 0}

/* ---- UI polish & personal programme / sharing (claude/ui-polish-share-qr) ---- */
.topbar{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.tabbar{background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.tab{position:relative;transition:color .15s}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);transform:translateX(-50%)}
h2.sec{font-size:26px;letter-spacing:.01em}
.page-heading small,.my-hero>small{display:block;font:500 10px var(--f-mono);letter-spacing:.2em;color:var(--accent)}
.primary-button,.secondary-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;border-radius:10px;padding:0 16px;font-size:14px;font-weight:600;transition:transform .12s,background .15s,border-color .15s}
.primary-button{background:var(--accent);color:#fffaf0}
:root[data-theme="dark"] .primary-button{color:#1b140f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary-button{color:#1b140f}}
.secondary-button{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.secondary-button:hover{border-color:var(--accent)}
.primary-button:active,.secondary-button:active,.xtile:active{transform:scale(.98)}
.text-button{color:var(--muted);font-size:13px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}

/* stats */
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;margin:18px 0}

.pstats small{font-size:11px;color:var(--muted);white-space:nowrap}
.pstats .good b{color:var(--teal)}
.pstats .bad{background:color-mix(in srgb,#b3261e 10%,var(--surface))}
.pstats .bad b{color:#c4372d}

/* my page */
.my-hero{padding:22px 0 8px;border-bottom:0}
.my-hero h2{font:900 34px/1.25 var(--f-display);margin:8px 0 6px}
.my-hero p{margin:0;color:var(--muted);font-size:14px}
.next-up{display:grid;grid-template-columns:auto 40px 1fr;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--fg);color:var(--bg);margin-bottom:6px}
.next-up .nu-label{font:500 10px var(--f-mono);letter-spacing:.14em;writing-mode:vertical-rl;opacity:.7}
.next-up .pthumb{width:40px;height:60px}
.nu-body{min-width:0;display:flex;flex-direction:column}
.nu-body b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nu-body small{font-size:12px;opacity:.75}
.my-menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:18px;overflow:hidden}
.my-menu .my-entry{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:16px;border-bottom:1px solid var(--line-soft);max-width:none}
.my-menu .my-entry:last-child{border-bottom:0}
.me-ic{width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.me-ic svg{width:22px;height:22px}
.my-entry b{font-size:17px}
.me-go{font-size:24px;color:var(--muted)}

/* day timeline */
.plan-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 18px}
.plan-toolbar .text-button{margin-left:auto}
.conflict{border:1px solid #c4372d;background:color-mix(in srgb,#b3261e 8%,var(--surface));color:var(--fg);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.conflict b{color:#c4372d}
.plan-days{display:flex;flex-direction:column;gap:22px}
.pday-h{display:flex;align-items:baseline;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.pday-h b{font:600 22px var(--f-mono);color:var(--accent)}
.pday-h span{font-weight:700;font-size:14px}
.pday-h small{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ptl{list-style:none;margin:0;padding:0}
.pitem{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:stretch}
.ptime{display:flex;flex-direction:column;padding-top:10px;font-variant-numeric:tabular-nums}
.ptime b{font:600 17px var(--f-mono)}
.ptime small{font:12px var(--f-mono);color:var(--muted)}
.pcard{position:relative;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 10px 10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft);min-width:0}
.pcard::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.pthumb{width:48px;height:72px;border-radius:5px;object-fit:cover;display:block;max-width:100%}
.pslate{display:grid;place-items:center;color:#fffaf0;font:900 20px var(--f-display)}
.pinfo{min-width:0;display:flex;flex-direction:column;gap:1px}
.ptitle{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:0;text-align:left}
.ptitle b{font-size:16px;line-height:1.35}
.ped{font:600 10px/1.6 var(--f-mono);padding:0 6px;border-radius:4px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
.pinfo small{font-size:12px;color:var(--muted)}
.pvenue{font-size:12px;color:var(--teal);font-weight:500}
.hall-tag{display:inline-block;max-width:100%;box-sizing:border-box;margin:2px 0 1px 6px;padding:0 8px;border-radius:8px;background:color-mix(in srgb,var(--teal) 12%,transparent);color:var(--teal);font-weight:600;font-size:.92em;line-height:1.6;white-space:normal;vertical-align:baseline;overflow-wrap:anywhere}
.premove{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line-soft)}
.premove:hover{color:#c4372d;border-color:#c4372d}
.premove svg{width:16px;height:16px}
.pgap{margin:0 0 0 62px;padding:7px 0 7px 14px;font-size:12px;color:var(--muted);border-left:2px dotted var(--line)}
.pgap.tight{color:var(--ochre)}
.pgap.clash{color:#c4372d;border-left:2px solid #c4372d;font-weight:600}
.pgap.clash span::before{content:"⚠ "}

/* export & share */
.shared-banner{border-radius:12px;background:var(--fg);color:var(--bg);padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.shared-banner p{margin:0 0 6px;font-size:13px;opacity:.8}
.share-panel{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.qr-box{background:#fff;border-radius:10px;padding:4px;line-height:0;box-shadow:0 1px 0 var(--line)}
.qr-box svg{width:100%;height:auto;display:block}
.share-body{min-width:0;display:flex;flex-direction:column;gap:6px}
.share-body>b{font-size:16px}
.share-body>small{font-size:12px;color:var(--muted);line-height:1.6}
.link-row{display:flex;gap:6px;margin-top:4px}
.link-row input{flex:1;min-width:0;padding:0 10px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:12px var(--f-mono)}
.link-row .secondary-button{flex:none}
.share-sys{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;text-decoration:none;color:var(--accent);font-weight:600}
.share-sys svg{width:16px;height:16px}
@media (max-width:420px){.share-panel{grid-template-columns:1fr}.qr-box{width:168px;margin:0 auto}}
.export-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 28px}
.xtile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.xtile:hover{border-color:var(--accent)}
.xt-ic{width:34px;height:34px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--accent);margin-bottom:6px}
.xt-ic svg{width:19px;height:19px}
.xtile b{font-size:14px}
.xtile small{font-size:11px;color:var(--muted);line-height:1.4}
.xtile.main{background:var(--accent);border-color:var(--accent);color:#fffaf0}
.xtile.main small{color:inherit;opacity:.8}
.xtile.main .xt-ic{background:rgba(255,255,255,.16);color:inherit}
@media (max-width:400px){.export-grid{grid-template-columns:1fr 1fr}.xtile.main{grid-column:1/-1}}

.share-paper{padding:0;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.paper-band{background:var(--oxblood);color:#fffaf0;padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px;background-image:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.06) 22px 23px)}
.paper-band b{font:italic 900 34px/1 var(--f-display);display:block}
.paper-band span{font:10px var(--f-mono);letter-spacing:.1em;opacity:.85;display:block;margin-top:8px}
.paper-band em{font-style:normal;font-weight:700;font-size:18px;border-top:2px solid rgba(255,250,240,.7);padding-top:10px;align-self:flex-start}
.paper-stats{display:flex;gap:22px;padding:14px 18px;border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--muted)}
.paper-stats b{font:600 20px var(--f-mono);color:var(--fg);margin-right:3px}
.share-paper .plan-days{padding:16px 18px}
.share-paper .pcard{background:var(--bg)}
.share-paper footer{display:flex;align-items:center;gap:16px;margin:0;padding:16px 18px;background:var(--fg);color:var(--bg)}
.paper-qr{width:92px;flex:none;background:#fff;border-radius:8px;padding:3px;line-height:0}
.paper-qr svg{width:100%;height:auto}
.share-paper footer>div{display:flex;flex-direction:column;gap:2px;font-size:11px;opacity:.85}
.share-paper footer b{font-size:15px;opacity:1}

/* image sheet */
html.sheet-open,html.sheet-open body{overflow:hidden}
.img-sheet{position:fixed;inset:0;z-index:200;background:rgba(15,10,6,.68);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 12px);animation:fadeIn .18s ease-out;overscroll-behavior:contain}
.img-sheet.out{opacity:0;transition:opacity .18s}
@keyframes fadeIn{from{opacity:0}}
.is-panel{background:var(--surface);width:100%;max-width:520px;height:calc(100vh - 12px);height:calc(100dvh - env(safe-area-inset-top,0px) - 12px);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));animation:sheetUp .24s ease-out;transition:transform .2s ease-out;will-change:transform}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
.is-grab{display:flex;justify-content:center;padding:8px 0 2px;touch-action:none}
.is-grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
.is-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 10px;touch-action:none;flex:none}
.is-head b{font-size:16px}
.is-close{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px 0 10px;border-radius:99px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;flex:none}
.is-close svg{width:16px;height:16px}
.is-img{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:0;flex:1}
.is-img img{display:block;width:100%;height:auto}
.is-tip{font-size:12px;color:var(--muted);text-align:center;margin:10px 0;flex:none}
.is-actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;flex:none}
@media (min-width:700px){.img-sheet{align-items:center;padding:24px}.is-panel{border-radius:18px;height:auto;max-height:calc(100vh - 48px);padding-top:4px}.is-grab{display:none}}
@media print{
  .shared-banner,.share-panel,.export-grid,.export-view .blockh,.img-sheet{display:none!important}
  .share-paper{border:0!important;border-radius:0}
  .paper-band{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .share-paper footer{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pitem,.pgap{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){.is-panel{animation:none}}

/* ---- Film detail page (claude/film-detail-redesign) ---- */
.fd{padding-bottom:28px}
.fd-hero{position:relative;overflow:hidden;color:#fffaf0;background:#1c1510;isolation:isolate}
.fd-bg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);max-width:none;object-fit:cover;filter:blur(30px) saturate(1.25);opacity:.85;z-index:-2;transform:scale(1.05)}
.fd-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,14,10,.35) 0%,rgba(20,14,10,.55) 45%,color-mix(in srgb,var(--fc) 55%,rgba(20,14,10,.92)) 100%)}
.fd-hin{display:grid;grid-template-columns:116px 1fr;gap:18px;align-items:end;padding-block:28px 24px}
.fd-poster{width:116px;max-width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.12)}
.fd-ph{display:grid;place-items:center;background:var(--fc)}
.fd-ph b{font:900 44px var(--f-display)}
.fd-title{min-width:0}
.fd-eyebrow{font:500 11px var(--f-mono);letter-spacing:.08em;opacity:.85;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fd-reg{font:600 10px var(--f-body);letter-spacing:.1em;padding:2px 7px;border-radius:4px;background:var(--fc);color:#fffaf0}
.fd-title h1{font:900 32px/1.15 var(--f-display);margin:8px 0 4px;text-wrap:balance;letter-spacing:.01em}
.fd-orig{font:italic 400 15px/1.35 var(--f-display);opacity:.9}
.fd-native{font-size:12px;opacity:.7;margin-top:2px}
.fd-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.fd-chips span{font-size:11px;padding:3px 8px;border-radius:5px;background:rgba(255,250,240,.14);border:1px solid rgba(255,250,240,.22)}
.fd-chips .fd-ed{background:#fffaf0;color:#2b2117;border-color:#fffaf0;font:700 11px var(--f-mono);letter-spacing:.04em}
.fd-by{margin-top:10px;font-size:13px;opacity:.85}
.fd-by b{font-weight:700;opacity:1}

.fd-body{display:flex;flex-direction:column;gap:0}
.fd-ratings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:16px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.fd-rt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 12px;min-width:0}
.fd-rt+.fd-rt{border-left:1px solid var(--line-soft)}
.fd-rl{font-size:10px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fd-rt b{font:600 19px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.fd-rt.na b{color:var(--muted);font-weight:400}
.fd-rbar{width:70%;height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.fd-rbar i{display:block;height:100%;background:var(--fc);border-radius:2px}

.fd-block{margin-top:22px}
.fd-h{font:700 13px var(--f-body);letter-spacing:.06em;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;color:var(--fg)}
.fd-h small{font-weight:400;color:var(--muted);font-size:12px}
.fd-ticket{display:grid;grid-template-columns:76px 1fr;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;position:relative}
.fd-ticket+.fd-ticket{margin-top:8px}
.fd-tdate{background:var(--fc);color:#fffaf0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;position:relative}
.fd-tdate::after{content:"";position:absolute;right:-1px;top:8px;bottom:8px;border-right:2px dashed var(--surface)}
.fd-tdate small{font-size:11px;opacity:.85}
.fd-tdate b{font:600 32px/1 var(--f-mono)}
.fd-tdate span{font-size:12px;margin-top:3px}
.fd-tbody{padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.fd-ttime{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.fd-ttime b{font:600 20px var(--f-mono)}
.fd-ttime .end{color:var(--muted);font-weight:400;font-size:16px}
.fd-ttime span{color:var(--muted)}
.fd-tbody>small{font-size:12px;color:var(--teal);font-weight:500}
.fd-tact{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fd-add{height:34px;padding:0 12px;border-radius:8px;background:var(--fc);color:#fffaf0;font-size:13px;font-weight:600}
.fd-add.on{background:transparent;color:var(--fg);border:1px solid var(--line)}
.fd-see{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.fd-see:hover,.fd-add.on:hover{border-color:var(--accent);color:var(--fg)}

.fd-credits{display:grid;grid-template-columns:auto 1fr;gap:0;margin:0;border-top:1px solid var(--line-soft)}
.fd-credits dt,.fd-credits dd{padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.fd-credits dt{color:var(--muted);padding-right:18px;white-space:nowrap}
.fd-credits dd{margin:0;min-width:0}

.fd-jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:5;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:22px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:8px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.fd-jump::-webkit-scrollbar{display:none}
.fd-jump button{flex:none;font-size:13px;padding:5px 12px;border-radius:99px;color:var(--muted)}
.fd-jump button:hover{background:var(--chip);color:var(--fg)}
.fd-sec{padding-top:26px}
.fd-st{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--fg)}
.fd-st span{font:900 21px var(--f-display)}
.fd-st small{font:500 10px var(--f-mono);letter-spacing:.18em;color:var(--muted);margin-left:auto}
.fd-syn p,.fd-dcard p,.fd-ctx p{margin:0 0 12px;max-width:65ch;font-size:15.5px;line-height:1.85}
.fd-syn>p:first-child::first-letter{font:900 2.6em/1 var(--f-display);float:left;margin:4px 8px 0 0;color:var(--fc)}
.fd-syn.clamp{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.fd-more{font-size:13px;font-weight:600;color:var(--accent);padding:4px 0}
.fd-watch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.fd-watch li{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft)}
.fd-watch span{font:900 28px/1 var(--f-display);color:var(--fc)}
.fd-watch p{margin:0;font-size:15px;line-height:1.75}
.fd-honors{list-style:none;margin:0;padding:0}
.fd-honor{display:grid;grid-template-columns:auto 44px 1fr;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.fd-ht{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap;border:1px solid var(--line);color:var(--muted);min-width:3.4em;text-align:center}
.fd-honor.win .fd-ht{background:var(--fc);border-color:var(--fc);color:#fffaf0}
.fd-honor.nom .fd-ht{border-color:var(--fc);color:var(--fc)}
.fd-honor.list .fd-ht{border-color:var(--teal);color:var(--teal)}
.fd-hy{font:500 13px var(--f-mono);color:var(--muted)}
.fd-hb{min-width:0;display:flex;flex-direction:column}
.fd-hb b{font-size:14px;font-weight:600}
.fd-hb small{font-size:13px;color:var(--muted)}
.fd-dcard{padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft)}
.fd-dhead{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.fd-av{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--fc);color:#fffaf0;font:900 22px var(--f-display)}
.fd-dhead b{display:block;font-size:17px}
.fd-dhead small{display:block;font-size:12px;color:var(--muted)}
.fd-ctx{margin:0;padding:6px 0 0 22px;border-left:3px solid var(--fc);position:relative}
.fd-ctx::before{content:"“";position:absolute;left:12px;top:-18px;font:900 54px/1 var(--f-display);color:var(--fc);opacity:.35}
.fd-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:34px}
.fd-nb{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.fd-nb:last-child{flex-direction:row-reverse;text-align:right}
.fd-nb img,.fd-nbs{width:36px;height:54px;border-radius:4px;object-fit:cover;flex:none}
.fd-nbs{display:grid;place-items:center;color:#fffaf0;font:900 16px var(--f-display)}
.fd-nb>span{min-width:0;display:flex;flex-direction:column}
.fd-nb small{font-size:11px;color:var(--muted)}
.fd-nb b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd-nb:hover{border-color:var(--accent)}

@media (min-width:640px){
  .fd-hin{grid-template-columns:150px 1fr;gap:26px;padding-block:40px 32px}
  .fd-poster{width:150px}
  .fd-title h1{font-size:42px}
}
@media (min-width:900px){
  .fd-hin{grid-template-columns:200px 1fr;gap:36px;padding-block:56px 40px}
  .fd-poster{width:200px}
  .fd-title h1{font-size:54px}
  .fd-orig{font-size:20px}
  .fd-body{display:grid;grid-template-columns:320px minmax(0,1fr);gap:48px;align-items:start}
  .fd-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);padding-bottom:20px}
  .fd-main{min-width:0}
  .fd-jump{margin:16px 0 0;padding:8px 0;top:calc(env(safe-area-inset-top,0px) + 61px)}
  .fd-syn p,.fd-dcard p,.fd-ctx p{font-size:16.5px}
  .fd-watch{display:grid;grid-template-columns:1fr 1fr}

/* ---- Add to home screen (claude/add-to-home) ---- */

.ev-slots{margin-top:10px;border-top:1px dashed var(--line-soft);padding-top:8px;display:grid;gap:8px}.ev-slots>small{font-size:12px;color:var(--muted)}.ev-slot{display:flex;align-items:center;justify-content:space-between;gap:10px}.ev-st{display:grid;gap:2px;min-width:0}.ev-st b{font-size:14px}.ev-st small{font-size:12px;color:var(--muted)}.ev-slot em{font-style:normal;font-size:12px;color:var(--muted)}.ev-add{flex:none;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer}.ev-add.on{background:var(--accent);color:#fff}

.ev-h{font-size:15px;margin:14px 0 8px;opacity:.8}.ev-card{border-top:1px solid var(--line,#ddd);padding:12px 0}.ev-card header{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ev-card p{font-size:14px;line-height:1.75;margin:6px 0}.ev-card dl{display:grid;grid-template-columns:5em 1fr;gap:4px 10px;font-size:13.5px;margin:6px 0 0}.ev-card dt{opacity:.6}.ev-card dd{margin:0;line-height:1.6}

.fd-part{border-top:1px solid var(--line,#ddd);padding:10px 0}.fd-part small{display:block;opacity:.7;margin-top:2px}.fd-part p{font-size:14px;line-height:1.75;margin:6px 0}.pg-ticketlink{margin:0 0 14px}

.fd-notes{border-left:3px solid #c0791f}.fd-warns{display:flex;flex-wrap:wrap;gap:6px}.fd-warn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 4px;border-radius:99px;color:#7a4a0c;background:#f6e3c2}.fd-warn i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#c0791f;color:#fff;font:700 11px/1 var(--f-mono);font-style:normal}.fd-warn-note{font-size:11px;color:var(--muted);margin:8px 0 0;line-height:1.6}

.fd-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.fd-act{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.4;padding:6px 13px 6px 10px;border-radius:99px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);cursor:pointer}.fd-act svg{width:14px;height:14px}.fd-act:focus-visible,.pg-act:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

<script>
/* ---- i18n：中文 / English ----
   语言：?lang=en|zh > 本机记住的选择 > 浏览器语言。英文版 = data/i18n/en.json（影片/专题/影院译文 + 界面词典 ui）。
   界面文字不逐处改代码：英文模式下由 tr() 在渲染后统一翻译页面文字与 aria-label 等属性，未收录的文字保持中文。 */
const LANG=(()=>{try{const q=new URLSearchParams(location.search).get("lang");if(q==="en"||q==="zh"){try{localStorage.setItem("sparrow-lang",q);}catch(e){}return q;}const s=localStorage.getItem("sparrow-lang");if(s==="en"||s==="zh")return s;}catch(e){}return /^zh/i.test(navigator.language||"zh")?"zh":"en";})();
const CJK=/[\u3000-\u303f\u3400-\u9fff\uff00-\uffef]/;
let EN={ui:{},exact:{},films:{},programmes:{},venues:{}},UIK=[];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pl=(n,one,many)=>n+" "+(+n===1?one:many);
const PATS=[
 [/间隔仅\s*(\d+)\s*分钟，留意入场时间/g,(m,n)=>"Only "+n+" min between screenings — mind the entry time"],
 [/有\s*(\d+)\s*组场次时间重叠/g,(m,n)=>pl(n,"pair of screenings overlaps","pairs of screenings overlap")],
 [/(\d+)\s*天后/g,(m,n)=>"in "+n+" days"],
 [/还有\s*(\d+)\s*场/g,(m,n)=>n+" more"],
 [/(\d{4})年(\d{1,2})月(\d{1,2})日\s*/g,(m,y,mo,d)=>MON[mo-1]+" "+(+d)+", "+y+" · "],
 [/(\d{1,2})月(\d{1,2})日/g,(m,a,b)=>MON[a-1]+" "+(+b)],
 [/(\d{1,2})月(?!\d)/g,(m,a)=>MON[a-1]],
 [/(\d+)\s*部影片/g,(m,n)=>pl(n,"film","films")],
 [/(\d+)\s*部/g,(m,n)=>pl(n,"film","films")],
 [/(\d+)\s*场放映/g,(m,n)=>pl(n,"screening","screenings")],
 [/(\d+)\s*场电影/g,(m,n)=>pl(n,"film","films")],
 [/(\d+)\s*场/g,(m,n)=>pl(n,"screening","screenings")],
 [/(\d+)\s*个放映日/g,(m,n)=>pl(n,"screening day","screening days")],
 [/(\d+)\s*个影厅/g,(m,n)=>pl(n,"hall","halls")],
 [/(\d+)\s*家有排片/g,(m,n)=>pl(n,"cinema with screenings","cinemas with screenings")],
 [/(\d+)\s*家/g,(m,n)=>pl(n,"cinema","cinemas")],
 [/(\d+)\s*天行程/g,(m,n)=>pl(n,"day","days")],
 [/(\d+)\s*天/g,(m,n)=>pl(n,"day","days")],
 [/(\d+)\s*个已结束/g,(m,n)=>n+" ended"],
 [/(\d+)\s*个进行中或即将开始/g,(m,n)=>n+" now showing or coming soon"],
 [/(\d+)\s*小时/g,(m,n)=>n+"h"],
 [/(\d+)\s*分钟/g,(m,n)=>n+" min"],
 [/(\d+)\s*分(?!钟)/g,(m,n)=>n+" min"],
 [/(\d+)\s*组/g,(m,n)=>pl(n,"pair","pairs")]
];
const PUNCT=[[/「([^」]*)」/g,(m,a)=>"“"+a+"”"],[/（/g,()=>" ("],[/）/g,()=>")"],[/，/g,()=>", "],[/：/g,()=>": "],[/。/g,()=>". "],[/、/g,()=>", "],[/！/g,()=>"!"],[/？/g,()=>"?"],[/｜/g,()=>" | "],[/＋/g,()=>"+"]];
function trCore(c){
  const u=EN.ui,x=EN.exact||{}; if(Object.prototype.hasOwnProperty.call(x,c)) return x[c]; if(Object.prototype.hasOwnProperty.call(u,c)) return u[c];
  let s=c; PATS.forEach(([re,fn])=>{ s=s.replace(re,fn); });
  for(const k of UIK){ if(s.indexOf(k)>=0) s=s.split(k).join(u[k]); }
  PUNCT.forEach(([re,fn])=>{ s=s.replace(re,fn); });
  s=s.replace(/\s{2,}/g," ").replace(/\s+([,.:!?”)])/g,"$1").replace(/\(\s+/g,"(").replace(/\s*·\s*$/,"").trim();
  return CJK.test(s)?c:s;
}
function tr(s){ if(LANG!=="en"||typeof s!=="string"||!CJK.test(s)) return s; const core=s.trim(); if(!core) return s; const out=trCore(core); return out===core?s:s.slice(0,s.indexOf(core))+out+s.slice(s.indexOf(core)+core.length); }
const TR_ATTRS=["aria-label","alt","title","placeholder"];
function trAttr(el,a){ const v=el.getAttribute(a); if(v&&CJK.test(v)){ const o=tr(v); if(o!==v) el.setAttribute(a,o); } }
function trNode(n){
  if(n.nodeType===3){ const p=n.parentNode; if(!p||p.nodeName==="SCRIPT"||p.nodeName==="STYLE"||p.nodeName==="TEXTAREA") return; const v=n.nodeValue; if(CJK.test(v)){ const o=tr(v); if(o!==v) n.nodeValue=o; } return; }
  if(n.nodeType!==1||n.nodeName==="SCRIPT"||n.nodeName==="STYLE") return;
  TR_ATTRS.forEach(a=>{ if(n.hasAttribute(a)) trAttr(n,a); });
  for(let c=n.firstChild;c;c=c.nextSibling) trNode(c);
}
async function startI18n(){
  if(LANG!=="en") return;
  document.documentElement.lang="en";
  try{ const r=await fetch("data/i18n/en.json",{cache:"no-store"}); if(r.ok){ const j=await r.json(); EN={ui:j.ui||{},exact:j.exact||{},films:j.films||{},programmes:j.programmes||{},venues:j.venues||{}}; UIK=Object.keys(EN.ui).sort((a,b)=>b.length-a.length); } }catch(e){ console.warn("English layer unavailable",e); }
  const P=CanvasRenderingContext2D.prototype,ft=P.fillText,mt=P.measureText;   // 长图画布里的中文也走词典
  P.fillText=function(t,...a){ return ft.call(this,tr(String(t)),...a); };
  P.measureText=function(t){ return mt.call(this,tr(String(t))); };
  document.title=tr(document.title); trNode(document.body);
  new MutationObserver(ms=>{ for(const m of ms){ if(m.type==="childList") m.addedNodes.forEach(trNode); else if(m.type==="characterData") trNode(m.target); else if(m.type==="attributes") trAttr(m.target,m.attributeName); } }).observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:TR_ATTRS});
}
function applyEN(cat,packs){
  if(LANG!=="en") return;
  (cat.programmes||[]).forEach(p=>{ const o=EN.programmes[p.id]; if(o) Object.assign(p,o); });
  (cat.venues||[]).forEach(v=>{ const o=EN.venues[v.id]; if(!o) return; const {halls,...rest}=o; Object.assign(v,rest); if(halls) (v.halls||[]).forEach(h=>{ if(halls[h.id]) Object.assign(h,halls[h.id]); }); });
  packs.forEach(pk=>pk&&(pk.films||[]).forEach(f=>{ const o=EN.films[f.id]; if(!o) return; f.cnZh=f.cn; const {title,...rest}=o; if(title) f.cn=title; Object.assign(f,rest); }));
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-lang-toggle]"); if(!b) return; const u=new URL(location.href); u.searchParams.set("lang",LANG==="en"?"zh":"en"); location.href=u.toString(); });
const REG = {cn:{n:"华语",c:"var(--oxblood)"},eu:{n:"欧洲",c:"var(--teal)"},us:{n:"美国",c:"var(--ochre)"},as:{n:"亚洲",c:"var(--olive)"},me:{n:"非洲",c:"#6d4c6f"},la:{n:"拉美",c:"#8a6350"}};
/* 影片、影院、专题与排片数据在 data/ 目录：data/catalog.json（专题与影院）+ data/programmes/<专题id>.json（片目与排片）。新增影展只需新增一个专题文件并在 catalog 中登记。 */
let FILMS=[], VENUES=[], PROGRAMMES=[], SH=[], VN={}, F={}, PG={}, days=[];

const hallOf = s => VN[s.v].halls.find(x=>x.id===s.h);
const placeOf = s => `${venueLabel(VN[s.v])} ${hallOf(s).name}`;
const placeHTML = s => `${esc(venueLabel(VN[s.v]))}<span class="hall-tag">${esc(hallOf(s).name)}</span>`; /* 影厅名较长时（如「5号Dolby Cinema 杜比影院厅」）作为独立小标签整体换行，不挤乱影院名 */
const keyOf = s => `${s.d}-${s.t}-${s.v}-${s.h}`;
let vfilt = "all", cityFilt = "all", venueQuery = "";
const editionOf = f => f.version||"";
const fhue = id => { const i=Object.keys(F).indexOf(id); return Math.round((i<0?0:i)*137.508%360); };
const langSub = f => [f.language, f.subtitles].filter(Boolean).join(" ｜ ");
const editionHTML = f => f.version ? ` <small class="edition">${esc(f.version)}</small>` : "";
const progOf = f => PG[f.prog||"style-kaleidoscope"];
const progShows = pid => SH.filter(x=>x.p===pid);
let pfilt = "all";
let sectionFilter="", sectionProgramme="";
const durationOf=s=>{const e=F[s.id].screeningEnds?.[keyOf(s)];return e?toMin(e)-toMin(s.t):F[s.id].min;};
const inProg = x => pfilt==="all" || x.p===pfilt;
/* 时间：?now=2026-11-07T15:00 可模拟当前时间，便于检查“已放映 / 已结束”的显示 */
const NOW_OVERRIDE = (()=>{try{const q=new URLSearchParams(location.search).get("now");const t=q?Date.parse(q):NaN;return isNaN(t)?null:t;}catch{return null;}})();
const now = () => NOW_OVERRIDE ?? Date.now();
const ymd = v => { const [y,m,d]=String(v).split("-").map(Number); return new Date(y,(m||1)-1,d||1).getTime(); };
const showEnd = s => showDate(s).getTime()+durationOf(s)*60000;
const isPast = s => showEnd(s) < now();
const STATUS = {live:"进行中", soon:"即将开始", ended:"已结束"};
function progRange(p){ const sh=progShows(p.id); const a=p.start?ymd(p.start):(sh.length?showDate(sh[0]).getTime():null); const b=p.end?ymd(p.end)+864e5:(sh.length?Math.max(...sh.map(showEnd)):null); return [a,b]; }
/* 常设专题（catalog 中 ongoing:true，如麻雀部落电影空间）：开始后一直算进行中，不进入往期 */
function progStatus(p){ const [a,b]=progRange(p), t=now(); if(a!=null&&t<a) return "soon"; if(!p.ongoing&&b!=null&&t>=b) return "ended"; return "live"; }
function progOrdered(){ const rank={live:0,soon:1,ended:2}; return PROGRAMMES.slice().sort((x,y)=>{const sx=progStatus(x),sy=progStatus(y);if(sx!==sy)return rank[sx]-rank[sy];const ux=progShows(x.id).some(s=>!isPast(s)),uy=progShows(y.id).some(s=>!isPast(s));if(ux!==uy)return ux?-1:1;const [ax,bx]=progRange(x),[ay,by]=progRange(y);return sx==="ended"?(by||0)-(bx||0):(ax||0)-(ay||0);}); }
function defaultProg(){ const open=progOrdered().filter(p=>progStatus(p)!=="ended"); const pick=open.find(p=>progShows(p.id).some(s=>!isPast(s)))||open.find(p=>progShows(p.id).length)||open[0]; return pick?pick.id:"all"; }
const statusTag = p => { const st=progStatus(p); return `<i class="pst pst-${st}">${p.ongoing&&st==="live"?"常设":STATUS[st]}</i>`; };
const progChips = (cur=pfilt) => { const open=progOrdered().filter(p=>progStatus(p)!=="ended"||p.id===cur); return `<div class="filters prog-chips">${[["all","全部专题"],...open.map(p=>[p.id,p.name])].map(([k,n])=>`<button class="fchip" data-pf="${k}" aria-pressed="${cur===k}">${esc(n)}</button>`).join("")}</div>`; };
const dateSpan = list => { if(!list.length) return ""; const ds=[...new Set(list.map(x=>x.d))]; return ds[0]+" – "+ds[ds.length-1]; };
function progCardHTML(p){ const n=progShows(p.id).length, fn=FILMS.filter(f=>f.prog===p.id||p.sections?.[f.id]).length; return `<button class="prog-card pc-${progStatus(p)}" data-prog="${p.id}">${p.cover?`<img src="${p.cardCover||p.cover}" alt="" loading="lazy">`:""}<span class="pc-body"><small>${statusTag(p)}${esc(p.kind)} · ${esc(p.period)}${p.city?` · ${esc(p.city)}`:""}</small><b>${esc(p.name)}</b><span>${esc(p.sub)} · ${fn} 部${n?` / ${n} 场`:""}</span></span><span class="pc-go">专题 ›</span></button>`; }
function programmesPage(){
  const all=progOrdered(), live=all.filter(p=>progStatus(p)==="live"), soon=all.filter(p=>progStatus(p)==="soon"), past=all.filter(p=>progStatus(p)==="ended");
  const sec=(t,en,list)=>list.length?`<h3 class="blockh pgl-h">${t} <small>${list.length} · ${en}</small></h3><div class="prog-strip">${list.map(progCardHTML).join("")}</div>`:"";
  main.innerHTML=`<section class="view gut"><h2 class="sec">专题</h2><p class="sub">影展、院线新片与艺术影院 · ${live.length+soon.length} 个进行中或即将开始</p>
    ${sec("进行中","NOW ON",live)}${sec("即将开始","COMING UP",soon)}
    ${past.length?`<details class="past-progs"><summary>往期专题 <small>${past.length} 个已结束</small></summary><div class="prog-strip">${past.map(progCardHTML).join("")}</div></details>`:""}
    ${all.length?"":`<div class="g-empty"><b>专题整理中</b><span>新的影展与放映专题会陆续上线</span></div>`}
    ${presentersHTML()}</section>`;
}
function progCardsHTML(){ const all=progOrdered(), open=all.filter(p=>progStatus(p)!=="ended"), past=all.filter(p=>progStatus(p)==="ended");
  return `<div class="prog-strip">${open.map(progCardHTML).join("")}</div>${past.length?`<details class="past-progs"><summary>往期专题 <small>${past.length} 个已结束</small></summary><div class="prog-strip">${past.map(progCardHTML).join("")}</div></details>`:""}`; }
const pst = id => (F[id]&&F[id].poster)||null;
const minText = f => f.minTbd ? "片长待定" : f.min+" 分钟";
const slateHTML = f => pst(f.id) ? `<span class="slate has" style="background:${REG[f.reg].c}"><img src="${pst(f.id)}" alt="${esc(f.cn)} 海报" loading="lazy"></span>` : `<span class="slate" style="background:${REG[f.reg].c}"><b>${esc(f.cn[0])}</b><span>${f.y}</span></span>`;
const WK = ["周日","周一","周二","周三","周四","周五","周六"];
const year = d => (+d.split("/")[0] >= 10 ? 2026 : 2027);
const wk = d => { const [m,dd]=d.split("/").map(Number); return WK[new Date(year(d),m-1,dd).getDay()]; };
const toMin = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
const fmt = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const paragraphsHTML = value => String(value||"").split(/\n{2,}/).map(p=>`<p>${esc(p)}</p>`).join("");
const creditsHTML = f => [
  ["导演", f.dir],
  ["联合导演", f.coDirector],
  [f.writerLabel||"编剧", (f.writers||[]).join(" / ")],
  ["原著", f.book],
  [(f.genre||[]).includes("纪录片")?"出镜":"主演", (f.cast||[]).join(" / ")],
  ["类型", (f.genre||[]).join(" / ")],
  ["国别", f.c],
  ["放映语言", f.language],
  ["字幕", f.subtitles],
  ["影片版权", LANG==="en"&&f.printSourceEn?f.printSourceEn:f.printSource],
  ["放映格式", f.medium],
  ["年龄提示", f.ageRating],
  ["无障碍", (f.access||[]).join(" / ")]
].filter(([,value])=>value).map(([name,value])=>`<dt>${esc(name)}</dt><dd>${esc(value)}</dd>`).join("");

const chevron = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>';

}

function progFilmGroups(pid,films){
  const up=[], gone=[];
  films.forEach(f=>{ const mine=SH.filter(s=>s.id===f.id&&s.p===pid).sort((a,b)=>showDate(a)-showDate(b)), next=mine.find(s=>!isPast(s));
    if(next||!mine.length) up.push({f,at:next?showDate(next):Infinity}); else gone.push({f,at:showDate(mine[mine.length-1])}); });
  up.sort((a,b)=>(a.at===b.at?0:a.at<b.at?-1:1)||filmOrder(a.f,b.f)); gone.sort((a,b)=>b.at-a.at||a.f.cn.localeCompare(b.f.cn,"zh"));

}
