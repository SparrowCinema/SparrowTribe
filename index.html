<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>风格万相影展</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a phone app shell — sticky top bar, three tabs (排片 Gantt / 片目 / 影展), full-screen film detail pages. Palette pulled from the poster: sea teal, sand, ochre, oxblood title red. */
:root{
  --bg:#efe6d4; --surface:#f8f2e6; --line:#d8cbb1; --line-soft:#e6dcc7;
  --fg:#2b2117; --muted:#7a6a55;
  --oxblood:#8e2a22; --teal:#2f6f6c; --ochre:#b26a1f; --olive:#5d6b2e;
  --accent:#8e2a22; --on-block:#fffaf0; --chip:#e5d8bf;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --px:2px;  /* Gantt scale: 2px per minute */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#211b15; --line:#3b3128; --line-soft:#2c241d;
  --fg:#f1e6d3; --muted:#a8977f; --oxblood:#a8382e; --teal:#33807b; --ochre:#b8741f; --olive:#6b7a35;
  --accent:#e0705e; --on-block:#fff8ec; --chip:#2e261e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#211b15; --line:#3b3128; --line-soft:#2c241d;
  --fg:#f1e6d3; --muted:#a8977f; --oxblood:#a8382e; --teal:#33807b; --ochre:#b8741f; --olive:#6b7a35;
  --accent:#e0705e; --on-block:#fff8ec; --chip:#2e261e; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px}
.topbar .row{display:flex;align-items:center;gap:12px;min-height:40px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:24px;color:var(--oxblood);letter-spacing:.02em}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.12em}
.topbar .sp{flex:1}
.pill{font-family:var(--f-mono);font-size:11px;padding:3px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted);white-space:nowrap}
.credit{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.credit small{font-size:10px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.back{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:500;padding:6px 8px 6px 0;color:var(--accent)}
.back svg{width:20px;height:20px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:11px;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

.view{padding-block:16px 24px}
h2.sec{font-family:var(--f-display);font-weight:900;font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}

/* legend + day chips */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Gantt */
.gantt{position:relative;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:10px;background:var(--surface);-webkit-overflow-scrolling:touch}
.g-inner{position:relative;display:grid;grid-template-columns:64px auto}
.g-corner,.g-day{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line)}
.g-corner{border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);display:flex;align-items:flex-end;padding:0 0 6px 8px;letter-spacing:.1em}
.g-ruler{position:relative;height:30px;border-bottom:1px solid var(--line)}
.g-ruler span{position:absolute;top:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);transform:translateX(-50%)}
.g-day{display:flex;flex-direction:column;justify-content:center;padding-left:10px;border-bottom:1px solid var(--line-soft);height:76px;min-width:0}
.g-day b{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.g-day small{font-size:11px;color:var(--muted)}
.g-track{position:relative;height:76px;border-bottom:1px solid var(--line-soft);
  background-image:repeating-linear-gradient(to right,var(--line-soft) 0 1px,transparent 1px calc(var(--px)*30)),repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px calc(var(--px)*60))}
.blk{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px;color:var(--on-block);text-align:left;overflow:hidden;border-right:1px solid var(--surface);border-left:1px solid var(--surface);transition:filter .15s}
.blk:hover{filter:brightness(1.08)}
.blk .t{font-weight:700;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blk .m{font-family:var(--f-mono);font-size:10.5px;opacity:.9;white-space:nowrap;font-variant-numeric:tabular-nums}
.blk.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{filter:brightness(1.35)}}
.gantt.compact{cursor:pointer;overflow:hidden}
.gantt.compact .g-day{padding-left:7px}
.gantt.compact .g-day b{font-size:12px}
.gantt.compact .g-ruler{height:22px}
.gantt.compact .g-ruler span{top:4px;font-size:10px}
.gantt.compact .blk{padding:4px 3px;justify-content:center}
.gantt.compact .blk .t{font-size:10.5px;font-weight:700;-webkit-line-clamp:2;line-height:1.15;word-break:break-all}
.gantt.compact:hover{border-color:var(--accent)}
.open-full{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--fg);color:var(--bg);text-align:left}
.open-full span{font-weight:700;font-size:15px}
.open-full small{flex:1;font-size:12px;opacity:.7}
.open-full svg{width:20px;height:20px;flex:none}
.full-g .gantt{max-height:none}
.hint{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}

/* agenda list under gantt */
.g-day .hl{font-size:10px;color:var(--accent);line-height:1.2;margin-top:2px}
.blockh{font-family:var(--f-display);font-weight:900;font-size:18px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.blockh small{font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.1em}
.venues{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.venue{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px}
.vhead{display:flex;align-items:center;gap:12px}
.vmark{width:40px;height:40px;flex:none;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:18px}
.vname{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.vname b{font-size:16px}.vname small{font-size:11px;color:var(--muted);letter-spacing:.14em}
.vcount{font-size:12px;color:var(--muted);text-align:right}.vcount b{font-family:var(--f-mono);font-size:20px;color:var(--fg);margin-right:2px}
.halls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hall{flex:1 1 140px;border-radius:8px;background:var(--bg);padding:9px 12px;display:flex;flex-direction:column}
.hall b{font-size:14px}.hall small{font-size:11px;color:var(--muted)}
.agenda{margin-top:26px;display:flex;flex-direction:column;gap:18px}
.ag-day h3{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 6px;font-weight:500}
.ag-row{display:grid;grid-template-columns:52px 4px 1fr auto;gap:10px;align-items:center;width:100%;padding:10px 0;border-bottom:1px solid var(--line-soft);text-align:left}
.ag-row .tm{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.ag-row .bar{align-self:stretch;border-radius:2px}
.ag-row .nm{min-width:0}
.ag-row .nm b{display:block;font-size:15px}
.ag-row .nm small{color:var(--muted);font-size:12px}
.chev{color:var(--muted);width:16px;height:16px}

/* films list */
.flist{display:flex;flex-direction:column}
.fcard{display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line-soft);text-align:left;width:100%}
.slate{aspect-ratio:2/3;width:58px;max-width:100%;border-radius:4px;color:var(--on-block);display:flex;flex-direction:column;justify-content:space-between;padding:6px;font-family:var(--f-mono);font-size:10px}
.slate b{font-family:var(--f-display);font-size:19px;line-height:1;font-weight:900}
.fcard .info{min-width:0}
.fcard .info b{font-size:16px;display:block;line-height:1.35}
.fcard .info .o{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .info .d{font-size:12px;color:var(--muted)}
.score{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted);line-height:1.4}
.score b{font-size:17px;color:var(--fg);display:block}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.fchip{flex:none;font-size:13px;padding:5px 12px;border-radius:99px;background:var(--chip);color:var(--fg)}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* detail */
.hero{color:var(--on-block);padding-block:22px 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.05) 22px 23px);pointer-events:none}
.slate.has{padding:0;overflow:hidden}
.slate img{width:100%;height:100%;object-fit:cover;display:block}
.hero.withp{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:end}
.hero-bg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);max-width:none;object-fit:cover;filter:blur(24px) brightness(.55) saturate(1.2);z-index:0}
.hero-p{position:relative;z-index:1;width:118px;max-width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hero-txt{position:relative;z-index:1;min-width:0}
.hero.withp h1{font-size:28px}
.hero .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;opacity:.85}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:36px;line-height:1.15;margin:6px 0 4px;text-wrap:balance}
.hero .orig{font-size:14px;opacity:.9;font-style:italic}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.hero .meta span{font-size:12px;padding:3px 9px;border:1px solid rgba(255,250,240,.45);border-radius:99px}
.ratings{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:-1px;padding-block:14px;background:var(--surface);border-bottom:1px solid var(--line)}
.rt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:8px;background:var(--bg);min-width:0}
.rt .lbl{font-size:10px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.rt .v{font-family:var(--f-mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.rt .v.na{color:var(--muted);font-weight:400}
.rt .u{font-size:9.5px;color:var(--muted);font-family:var(--f-mono)}
.rnote{font-size:11px;color:var(--muted);padding-block:6px 0}
.shows{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.show{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}
.show .dt{font-family:var(--f-mono);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.show .x{flex:1;font-size:13px;color:var(--muted)}
.show .go{font-size:12px;color:var(--accent);font-weight:500}
.dsec{margin-top:26px}
.dsec h3{font-family:var(--f-display);font-size:18px;font-weight:900;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.dsec h3 small{font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.12em}
.dsec p{margin:0 0 10px;max-width:65ch}
.dir-card{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.mono-av{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--on-block);font-family:var(--f-display);font-weight:900;font-size:18px}
.dir-card b{display:block}
.dir-card small{color:var(--muted);font-size:12px}
.statement{border-left:3px solid var(--line);padding-left:14px;color:var(--fg)}
.src{font-size:11px;color:var(--muted)}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:30px}
.nav2 button{border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;font-size:12px;color:var(--muted);min-width:0}
.nav2 button b{display:block;color:var(--fg);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav2 button:last-child{text-align:right}

.film-facts{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:12px 16px;margin:0;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px;line-height:1.85}
.film-facts dt{color:var(--muted)}.film-facts dd{margin:0;overflow-wrap:anywhere}
.synopsis p{line-height:1.95;margin-bottom:16px}
@media(min-width:900px){.film-facts{max-width:820px}.synopsis p{max-width:70ch}}
/* about */
.about p{max-width:65ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:14px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
@media (min-width:900px){
  .app{max-width:1240px}
  .tabbar .in{max-width:1240px}
  .flist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
  .agenda{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}
  .agenda .blockh{grid-column:1/-1;margin:0}
  .venues{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .venues .blockh{grid-column:1/-1}
  .hero.withp{grid-template-columns:180px 1fr;padding-block:36px 30px}
  .hero-p{width:180px}
  .hero.withp h1{font-size:40px}
  .ratings{gap:12px}
  .dsec p{font-size:16px}
}
@media (min-width:1300px){.flist{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="topbar gut" id="topbar"></header>
  <main id="main"></main>
</div>
<nav class="tabbar" aria-label="主导航"><div class="in">
  <button class="tab" data-tab="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h5M10 17h7"/></svg>排片</button>
  <button class="tab" data-tab="films"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 8h16M4 16h16M8 3v18M16 3v18"/></svg>片目</button>
  <button class="tab" data-tab="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>影展</button>
</div></nav>

<script>
const REG = {cn:{n:"华语",c:"var(--oxblood)"},eu:{n:"欧洲",c:"var(--teal)"},us:{n:"美国",c:"var(--ochre)"},as:{n:"伊朗",c:"var(--olive)"}};

/* r: [豆瓣/10, IMDb/10, 烂番茄新鲜度%, Metacritic/100, Letterboxd/5]; null = 平台暂无评分 */
const FILMS = [
{id:"wild-strawberries",cn:"野草莓",o:"Smultronstället",y:1957,c:"瑞典",min:91,reg:"eu",dir:"英格玛·伯格曼",dirO:"Ingmar Bergman",dirLife:"1918–2007 · 瑞典",
 r:[8.7,8.1,95,88,4.2],
 syn:"七十八岁的医学教授伊萨克乘车前往隆德大学接受荣誉学位。同行的有儿媳玛丽安，途中又捎上几个年轻搭车客。一路上，他重返童年的避暑老宅，在白日梦与噩梦里与初恋、亡妻和年轻的自己相遇，渐渐看清自己一生的冷漠与孤独。",
 bio:"瑞典导演、编剧、戏剧导演，以《第七封印》《假面》《呼喊与细语》《芬妮与亚历山大》等作品成为现代电影最重要的作者之一。他的电影长期追问信仰、死亡、婚姻与自我，擅长用特写和梦境呈现人物内心。",
 st:"伯格曼回忆，这部电影的念头来自一次开车经过乌普萨拉外祖母老宅的经历：他设想推开门，就能回到童年的世界。片中主人公名字的缩写 I.B. 与导演本人相同，他也承认伊萨克身上有自己对父辈、对自身冷漠的审视。老演员维克多·斯约斯特洛姆出演主角，是他特意向这位瑞典默片大师致敬的选择。"},
{id:"dogville",cn:"狗镇",o:"Dogville",y:2003,c:"丹麦 / 瑞典 / 英国等",min:178,reg:"eu",dir:"拉斯·冯·提尔",dirO:"Lars von Trier",dirLife:"1956– · 丹麦",
 r:[8.9,8.0,71,61,4.1],
 syn:"大萧条年代，逃避黑帮追杀的格蕾丝躲进落基山脚下的小镇狗镇。镇民答应收留她，条件是她为大家干活。随着悬赏升高，善意一点点变成剥削与凌辱。整部电影在只用粉笔画出房屋轮廓的摄影棚里拍成，章节体旁白推动着这则关于人性的寓言。",

{id:"turin-horse",cn:"都灵之马",o:"A torinói ló",y:2011,c:"匈牙利 / 法国等",min:146,reg:"eu",dir:"贝拉·塔尔",dirO:"Béla Tarr",dirLife:"1955– · 匈牙利",

function ganttHTML(k, rowH, labW, compact, list){
  const S = toMin("12:00"), E = toMin("22:30"), W = Math.round((E-S)*k);
  const allHalls = VENUES.flatMap(v=>v.halls.map(h=>({v:v.id,h:h.id})));
  const multi = new Set(list.map(x=>x.v+"/"+x.h)).size > 1;
  const step = k < 1 ? 120 : 60;
  let ruler = "";
  for(let m=S+step;m<=E;m+=step) ruler += `<span style="left:${Math.round((m-S)*k)}px">${compact?String(m/60|0):fmt(m)}</span>`;
  let rows = "";
  days.forEach(d=>{
    allHalls.forEach(hh=>{
      const hs = list.filter(x=>x.d===d && x.v===hh.v && x.h===hh.h);
      if(!hs.length) return;
      const lab = multi ? `<small class="hl">${esc(placeOf(hs[0]))}</small>` : "";
      rows += `<div class="g-day" style="height:${rowH}px"><b>${d}</b>${compact?"":`<small>${wk(d)}</small>`}${lab}</div><div class="g-track" style="width:${W}px;height:${rowH}px">`;
      hs.forEach(x=>{
        const f=F[x.id], st=toMin(x.t), en=st+f.min, w=Math.round(f.min*k);
        const inner = compact
          ? `<span class="t">${w>=30?esc(f.cn.length>4&&w<60?f.cn.slice(0,3)+"…":f.cn):""}</span>`
          : `<span class="t">${esc(f.cn)}</span><span class="m">${x.t}–${fmt(en)} · ${f.min}′</span>`;
        const tag = compact ? "span" : "button";
        rows += `<${tag} class="blk" ${compact?"":`data-film="${x.id}"`} data-key="${keyOf(x)}" style="left:${Math.round((st-S)*k)}px;width:${w}px;background:${REG[f.reg].c}" aria-label="${d} ${x.t} ${esc(f.cn)}">${inner}</${tag}>`;
      });
      rows += `</div>`;
    });
  });
  return `<div class="gantt${compact?" compact":""}" id="gantt" style="--px:${k}px" ${compact?'data-open-gantt role="button" tabindex="0" aria-label="打开完整排片"':""}><div class="g-inner" style="grid-template-columns:${labW}px auto">
    <div class="g-corner">${compact?"":"日期"}</div><div class="g-ruler" style="width:${W}px">${ruler}</div>${rows}</div></div>`;
}
const SPAN = toMin("22:30")-toMin("12:00");
function fitK(labW){ const app=document.querySelector(".app"); const w=(app?app.clientWidth:window.innerWidth) - 2*Math.max(16,0) - labW - 4; return w/SPAN; }

function schedule(){
  const list = SH.filter(x=>vfilt==="all"||x.v===vfilt);
  const kFit = fitK(64);
  const wide = kFit >= 1.5;
  const k = wide ? kFit : fitK(46);
  const gantt = wide ? ganttHTML(kFit, 76, 64, false, list) : ganttHTML(k, 44, 46, true, list);
  let ag = "";
  days.forEach(d=>{
    const ds = list.filter(x=>x.d===d); if(!ds.length) return;
    ag += `<div class="ag-day"><h3>${d} · ${wk(d)}</h3>`;
    ds.forEach(x=>{const f=F[x.id];
      ag += `<button class="ag-row" data-film="${x.id}"><span class="tm">${x.t}</span><span class="bar" style="background:${REG[f.reg].c}"></span><span class="nm"><b>${esc(f.cn)}</b><small>${esc(placeOf(x))} · ${esc(f.dir)} · ${f.min} 分钟</small></span>${chevron}</button>`;});
    ag += `</div>`;
  });
  const allHalls = VENUES.flatMap(v=>v.halls);
  const vchips = VENUES.length>1 ? `<div class="filters">${[["all","全部影院"],...VENUES.map(v=>[v.id,v.name])].map(([kk,n])=>`<button class="fchip" data-vf="${kk}" aria-pressed="${vfilt===kk}">${esc(n)}</button>`).join("")}</div>` : "";
  const venues = VENUES.map(v=>{

  }).join("");
  main.innerHTML = `<section class="view gut">
    <h2 class="sec">排片表</h2><p class="sub">2026.10.30 – 11.08 · ${wide?"点击色块看影片":"点击排片图进入详细排片"}</p>

    <div class="legend">${Object.values(REG).map(r=>`<span><i style="background:${r.c}"></i>${r.n}</span>`).join("")}</div>
    ${gantt}
    ${wide?"":`<button class="open-full" data-open-gantt><span>进入详细排片</span><small>左右滑动 · 点击色块看影片</small><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/></svg></button>`}
    <div class="venues"><h3 class="blockh">影院 <small>VENUES · ${VENUES.length} 家 / ${allHalls.length} 个影厅</small></h3>${venues}</div>
    <div class="agenda"><h3 class="blockh">逐日场次 <small>DAILY</small></h3>${ag}</div></section>`;
  if(wide) flashIn(document.getElementById("gantt"));
}

function ganttFull(){
  const list = SH.filter(x=>vfilt==="all"||x.v===vfilt);

  const g = document.getElementById("gantt");

}
function flashIn(g){
  if(!pendingFlash||!g) return false;
  const bk=g.querySelector(`[data-key="${pendingFlash}"]`); pendingFlash=null;
  if(!bk) return false;
  g.scrollLeft = bk.offsetLeft - 80; bk.scrollIntoView({block:"center"}); bk.classList.add("flash"); return true;
}

      <div class="dir-card"><span class="mono-av" style="background:${col}">${esc(f.dir[0])}</span><span><b>${esc(f.dir)}</b><small>${esc(f.dirO)} · ${esc(f.dirLife)}</small></span></div><p>${esc(f.bio)}</p></div>
    <div class="dsec"><h3>导演阐述 <small>STATEMENT</small></h3><p class="statement">${esc(f.st)}</p><p class="src">据导演访谈、著述及公开资料整理转述，非原文引语。</p></div>
    <div class="nav2">${prev?`<button data-film="${prev.id}">‹ 上一部<b>${esc(prev.cn)}</b></button>`:"<span></span>"}${next?`<button data-film="${next.id}">下一部 ›<b>${esc(next.cn)}</b></button>`:"<span></span>"}</div>
    <div style="height:12px"></div></div>`;
}

function about(){
  main.innerHTML = `<section class="view gut about"><h2 class="sec">关于影展</h2>
    <p class="sub">风格万相 · 中外经典影片展</p>
    <dl class="kv"><dt>展期</dt><dd>2026.10 – 2027.01</dd><dt>影院</dt><dd>${VENUES.map(v=>esc(v.name+"（"+v.halls.map(h=>h.name).join("、")+"）")).join("<br>")}</dd><dt>本页场次</dt><dd>10.30 – 11.08，共 ${SH.length} 场 / ${FILMS.length} 部</dd></dl>
    <p>从伯格曼的公路回忆到塔可夫斯基的末日祈祷，从费穆的城墙到徐克的江湖，十七部作品横跨 1947 至 2025 年，排在同一块银幕上，恰好是一份关于“风格”的地图。</p>
    <p class="src">后续场次公布后将补充至排片表。</p></section>`;
}

let pendingFlash=null, lastList="schedule";
function go(h){ location.hash = h; }
function route(){
  const h = location.hash.slice(1) || "schedule";
  const tab = (h.startsWith("film-")||h==="gantt") ? null : h;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current", t.dataset.tab===(tab||lastList)?"page":"false"));
  if(tab){ lastList = tab; topEl.innerHTML = brandBar(); }
  if(h.startsWith("film-")) detail(h.slice(5));
  else if(h==="films") films();
  else if(h==="about") about();
  else if(h==="gantt") ganttFull();
  else schedule();
  if(!pendingFlash) window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-film],[data-tab],[data-filt],[data-vf],[data-back],[data-jump],[data-open-gantt]"); if(!t) return;
  if(t.dataset.film) go("film-"+t.dataset.film);
  else if(t.dataset.tab) go(t.dataset.tab);
  else if(t.dataset.filt){ filt=t.dataset.filt; films(); }
  else if(t.dataset.vf){ vfilt=t.dataset.vf; schedule(); }
  else if(t.hasAttribute("data-back")) go(lastList);
  else if(t.dataset.jump){ pendingFlash=t.dataset.jump; go(fitK(64)>=1.5?"schedule":"gantt"); }
  else if(t.hasAttribute("data-open-gantt")) go("gantt");
});
window.addEventListener("hashchange",route);
let rz; let lastW=window.innerWidth; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(Math.abs(window.innerWidth-lastW)<40)return;lastW=window.innerWidth;const h=location.hash.slice(1)||"schedule";if(h==="schedule")schedule();else if(h==="gantt")ganttFull();},200)});
route();
</script>
