/* Ticket purchase: original mini-program codes, uncropped */

.ticket-modal img{display:block;width:100%;max-width:430px;margin:18px auto 12px;background:#fff;border-radius:10px;height:auto}

.ag-row .bar.fc{border:0;background:hsl(var(--h) 40% 62%)!important}

/* ---- 专题底栏页（claude/programmes-tab） ---- */

.selector-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;gap:12px}.selector-head h2{font-size:14.0px;line-height:1.3;margin:0}.selector-close{border:0;background:var(--bg);border-radius:50%;width:30px;height:30px;color:var(--muted);font-size:15.8px;line-height:1;cursor:pointer}

ow:hidden;margin-top:15px}.taste-grid>span{font-size:11px;color:var(--muted);padding:6px 9px;display:flex;pointer-events:none}.taste-grid>span:nth-child(1){align-items:flex-start;justify-content:flex-start}.taste-grid>span:nth-child(2){align-items:flex-start;justify-content:flex-end}.taste-grid>span:nth-child(3){align-items:flex-end;justify-content:flex-start}.taste-grid>span:nth-child(4){align-items:flex-end;justify-content:flex-end}.taste-grid>span:nth-child(odd){border-right:1px dashed var(--line)}.taste-grid>span:nth-child(-n+2){border-bottom:1px dashed var(--line)}.taste-point{position:absolute!important;width:11px;height:11px;border-radius:50%;background:var(--accent);border:1px solid var(--surface);transform:translate(-50%,-50%);padding:0!important;z-index:2}.taste-map footer{display:flex;flex-wrap:wrap;gap:10px;font-size:12px}.taste-map footer span{flex:1 1 40%}
